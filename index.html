<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Консультації педіатра у медичному центрі «Мамин Дім» у Харкові.">
  <title>Педіатр — Мамин Дім</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="figma-page" aria-label="Сторінка консультації педіатра">
    <img class="figma-page__image" src="photos/figma/full-page.png" width="1440" height="9484" alt="Консультації педіатра у медичному центрі Мамин Дім">

    <button class="hotspot hotspot--hero-book" type="button" data-open-booking aria-label="Обрати педіатра"></button>
    <a class="hotspot hotspot--hero-more" href="#help" aria-label="Дізнатися більше"></a>
    <button class="hotspot hotspot--help-book" type="button" data-open-booking aria-label="Записатися на консультацію"></button>
    <button class="hotspot hotspot--process-book" type="button" data-open-booking aria-label="Записатися до педіатра"></button>
    <button class="hotspot hotspot--format-first" type="button" data-open-booking aria-label="Записатися на первинну консультацію"></button>
    <button class="hotspot hotspot--format-repeat" type="button" data-open-booking aria-label="Записатися на повторну консультацію"></button>
    <button class="hotspot hotspot--format-home" type="button" data-open-booking aria-label="Записатися на консультацію вдома"></button>
    <button class="hotspot hotspot--form-book" type="button" data-open-booking aria-label="Записатися до лікаря"></button>
    <button class="hotspot hotspot--slots-book" type="button" data-open-booking aria-label="Зайняти вільне місце"></button>
    <button class="hotspot hotspot--faq-book" type="button" data-open-booking aria-label="Записатися на консультацію"></button>
    <button class="hotspot hotspot--contact-send" type="button" data-open-booking aria-label="Надіслати заявку"></button>
    <span id="help" class="anchor anchor--help" aria-hidden="true"></span>
  </main>

  <dialog class="booking-dialog" id="booking-dialog" aria-labelledby="booking-title">
    <button class="booking-dialog__close" type="button" data-close-booking aria-label="Закрити">×</button>
    <div class="booking-dialog__brand">МАМИН ДІМ</div>
    <h2 id="booking-title">Записатися до лікаря педіатра</h2>
    <p>Залиште контакти — адміністратор уточнить зручний час прийому.</p>
    <form class="booking-form" data-booking-form novalidate>
      <label>Ваше ім’я<input name="name" autocomplete="name" placeholder="Як до вас звертатися?"></label>
      <label>Номер телефону<input name="phone" type="tel" autocomplete="tel" placeholder="+38 (___) ___-__-__" required></label>
      <label>Бажана дата<input name="desired_slot" type="date" data-booking-date></label>
      <label>Коментар<textarea name="message" rows="3" placeholder="Опишіть запит"></textarea></label>
      <input class="honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Записатися</button>
      <p class="booking-form__note" data-form-note aria-live="polite"></p>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
