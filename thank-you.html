<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дякуємо за заявку — Мамин Дім</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .thanks-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:linear-gradient(180deg,var(--blue-light) 0%,var(--blue-light) 55%,#fff 100%);}
  .thanks-box{max-width:760px;width:100%;text-align:center;}
  .thanks-icon{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;}
  .thanks-box h1{font-size:28px;margin-bottom:10px;}
  .thanks-box p.muted{font-size:15px;margin-bottom:28px;}
  .thanks-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:28px;background:#0b1c2c;}
  .thanks-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .thanks-social-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em;}
  .thanks-back{display:inline-block;margin-top:26px;font-size:13.5px;color:var(--blue);font-weight:700;}
</style>

<body>

<section class="thanks-screen">
  <div class="thanks-box">
    <div class="thanks-icon" aria-hidden="true">✓</div>
    <h1>Дякуємо! Заявку прийнято</h1>
    <p class="muted">Ми зателефонуємо вам найближчим часом, щоб підібрати зручний час прийому. А поки — коротке відео про нашу клініку:</p>

    <div class="thanks-video">
      <iframe
        src="https://www.youtube.com/embed/DGA-8rLQKY8?si=jc01in-OWXQAC2mS"
        title="Мамин Дім — відео"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        loading="lazy"></iframe>
    </div>

    <a href="index.html" class="thanks-back">← Повернутися на сайт</a>
  </div>
</section>

</html>
